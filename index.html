<style>
  :root {
    --ink: #1b2340;
    --ink-soft: #5a6385;
    --bg: #f5f6fd;
    --card: #ffffff;
    --line: #e4e7f6;
    --tint: #eef0fd;
    --link: #4338ca;
    --r1: #ff4d6d;
    --r2: #ff8a3d;
    --r3: #ffc41f;
    --r4: #22c58b;
    --r5: #2d8cff;
    --r6: #5b5be6;
    --r7: #a855f7;
    --rainbow: linear-gradient(90deg, var(--r1), var(--r2), var(--r3), var(--r4), var(--r5), var(--r6), var(--r7));
    --brand: linear-gradient(135deg, #2563eb, #7c3aed);
    --warn-bg: #fff1c9;
    --warn-fg: #7a4b00;
    --ok-bg: #d9f7e8;
    --ok-fg: #08683f;
    --shadow: 0 10px 26px -14px rgba(67, 56, 202, 0.45);
    --font-head: 'Space Grotesk', 'Inter', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eef0ff;
      --ink-soft: #a4abd1;
      --bg: #0f1226;
      --card: #181c3a;
      --line: #2b3060;
      --tint: #212650;
      --link: #a5b4fc;
      --warn-bg: rgba(255, 196, 31, 0.18);
      --warn-fg: #ffd666;
      --ok-bg: rgba(34, 197, 139, 0.18);
      --ok-fg: #6ee7b7;
      --shadow: 0 10px 26px -14px rgba(0, 0, 0, 0.7);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 26px 14px 36px;
    min-height: 100%;
    background:
      radial-gradient(circle at 12% 0%, rgba(255, 77, 109, 0.12), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(45, 140, 255, 0.14), transparent 42%),
      radial-gradient(circle at 50% 100%, rgba(168, 85, 247, 0.12), transparent 45%),
      var(--bg);
  }
  button { font-family: var(--font-body); }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid var(--r5);
    outline-offset: 2px;
  }

  /* ---------- brand strip (desktop preview only) ---------- */
  .brand { width: 100%; max-width: 420px; display: flex; align-items: center; gap: 12px; }
  .brand-badge {
    width: 44px; height: 44px; border-radius: 13px; background: var(--brand);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: var(--shadow);
  }
  .brand-badge svg { width: 25px; height: 25px; }
  .brand-text h1 { font-family: var(--font-head); font-size: 20px; margin: 0; line-height: 1.05; }
  .brand-text p { margin: 3px 0 0; font-size: 11.5px; color: var(--ink-soft); }
  .rainbow-text {
    background: var(--rainbow); -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
  }

  .install-banner {
    width: 100%; max-width: 420px; display: flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, #1e1b4b, #4338ca); color: #fff;
    border-radius: 16px; padding: 11px 10px 11px 14px;
  }
  .install-banner[hidden] { display: none; }
  .install-banner-icon { font-size: 20px; flex-shrink: 0; }
  .install-banner-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .install-banner-text strong { font-family: var(--font-head); font-size: 13px; }
  .install-banner-text span { font-size: 11px; color: #c7d2fe; line-height: 1.35; }
  .install-banner-btn {
    background: var(--r3); color: #2b1d00; border: none; font-weight: 700; font-size: 12.5px;
    padding: 9px 14px; border-radius: 10px; cursor: pointer; flex-shrink: 0; min-height: 40px;
  }
  .install-banner-close { background: none; border: none; color: #c7d2fe; font-size: 14px; cursor: pointer; padding: 8px; flex-shrink: 0; }

  .proto-controls { width: 100%; max-width: 420px; display: flex; gap: 8px; }
  .proto-btn {
    flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    font-weight: 600; font-size: 12.5px; padding: 10px 6px; border-radius: 12px; cursor: pointer;
  }
  .proto-btn:hover { color: var(--link); }

  /* ---------- phone frame ---------- */
  .phone {
    width: 100%; max-width: 380px; height: min(780px, 84vh);
    background: #14123a; border-radius: 44px; padding: 12px; position: relative;
    box-shadow: 0 34px 60px -26px rgba(49, 46, 129, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
  }
  .phone-notch {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 22px; background: #14123a; border-radius: 0 0 16px 16px; z-index: 5;
  }
  .screen {
    width: 100%; height: 100%; background: var(--bg); border-radius: 32px; overflow: hidden;
    display: flex; flex-direction: column; position: relative;
  }
  .rainbow-bar { height: 5px; flex: none; background: var(--rainbow); }
  .screen-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px 18px; }
  .screen-scroll::-webkit-scrollbar { width: 0; }

  .toast {
    position: absolute; left: 50%; bottom: 84px; transform: translate(-50%, 12px);
    background: #1b1747; color: #fff; font-size: 12.5px; font-weight: 600; padding: 10px 16px;
    border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    z-index: 20; max-width: 86%; text-align: center; box-shadow: 0 10px 24px -10px rgba(0,0,0,.6);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- type + generic ---------- */
  .h1 { font-family: var(--font-head); font-size: 22px; margin: 0 0 4px; }
  .h2 { font-family: var(--font-head); font-size: 16px; margin: 0 0 2px; }
  .section-title { font-family: var(--font-head); font-size: 15px; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ""; width: 5px; height: 16px; border-radius: 3px; background: var(--brand); }
  .muted { color: var(--ink-soft); font-size: 12.5px; margin: 0; }
  .grow { flex: 1; min-width: 0; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .center { text-align: center; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 12px 13px; border-radius: 12px; border: 1.5px solid var(--line);
    font-family: var(--font-body); font-size: 14px; background: var(--card); color: var(--ink); min-height: 46px;
  }
  .field input:focus, .field select:focus { border-color: var(--r6); }
  .form-error {
    background: rgba(255, 77, 109, 0.12); color: #be123c; border-radius: 10px;
    padding: 9px 12px; font-size: 12.5px; font-weight: 600; margin-bottom: 12px;
  }
  .form-error[hidden] { display: none; }
  @media (prefers-color-scheme: dark) { .form-error { color: #fda4af; } }

  .btn {
    width: 100%; padding: 13px; border-radius: 14px; border: none; min-height: 48px;
    font-weight: 700; font-size: 14.5px; cursor: pointer; transition: transform .08s ease, filter .15s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:active { transform: scale(0.98); }
  .btn svg { width: 19px; height: 19px; }
  .btn-primary { background: var(--brand); color: #fff; box-shadow: var(--shadow); }
  .btn-primary:hover { filter: brightness(1.07); }
  .btn-ghost { background: var(--card); color: var(--link); border: 1.5px solid var(--line); }
  .btn-light { background: #fff; color: #3730a3; }
  .btn-saved { background: var(--ok-bg); color: var(--ok-fg); }
  .btn-danger { background: transparent; color: #e11d48; border: 1.5px solid #fda4af; }
  .link-btn { background: none; border: none; color: var(--link); font-weight: 700; font-size: 12.5px; cursor: pointer; padding: 4px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 14px; margin-bottom: 12px; box-shadow: 0 4px 14px -12px rgba(67, 56, 202, 0.5);
  }
  .card.flush { padding: 4px 10px; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; background: var(--tint); color: var(--link);
    font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  }
  .status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .status.sm { font-size: 10px; padding: 2px 7px; }
  .status.unv { background: var(--warn-bg); color: var(--warn-fg); }
  .status.ver { background: var(--ok-bg); color: var(--ok-fg); }

  .icon-circle {
    width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; color: #fff;
  }
  .icon-circle svg { width: 20px; height: 20px; }

  /* topbar */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px 6px; }
  .topbar .back {
    width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; color: var(--link);
  }
  .topbar h2 { margin: 0; font-family: var(--font-head); font-size: 17px; flex: 1; min-width: 0; }
  .topbar-extra { display: flex; align-items: center; }

  /* bottom nav */
  .bottomnav {
    display: flex; border-top: 1px solid var(--line); background: var(--card);
    padding: 10px 6px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .navitem {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none;
    font-size: 11px; font-weight: 600; color: var(--ink-soft); cursor: pointer; padding: 4px; position: relative; min-height: 44px;
  }
  .navitem svg { width: 21px; height: 21px; }
  .navitem.active { color: var(--link); }
  .navitem.active::before {
    content: ""; position: absolute; top: -11px; left: 50%; width: 26px; height: 3px;
    transform: translateX(-50%); border-radius: 3px; background: var(--rainbow);
  }

  /* ---------- splash ---------- */
  .splash {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 30px 26px; color: #fff; position: relative; overflow: hidden;
    background: linear-gradient(160deg, #1e1b4b 0%, #4338ca 48%, #7c3aed 100%);
  }
  .splash::before, .splash::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
  .splash::before { width: 260px; height: 260px; right: -90px; top: -80px; background: radial-gradient(circle, rgba(255, 196, 31, 0.55), transparent 68%); }
  .splash::after { width: 300px; height: 300px; left: -110px; bottom: -120px; background: radial-gradient(circle, rgba(34, 197, 139, 0.5), transparent 68%); }
  .splash > * { position: relative; z-index: 1; }
  .splash-logo {
    width: 84px; height: 84px; border-radius: 26px; background: rgba(255, 255, 255, 0.16);
    display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
    border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(6px);
  }
  .splash-logo svg { width: 46px; height: 46px; }
  .splash h1 { font-family: var(--font-head); font-size: 28px; margin: 0; line-height: 1.1; }
  .splash p.tag { color: #e0e7ff; font-size: 13.5px; margin: 8px 0 20px; }
  .splash-chips { display: flex; gap: 8px; margin-bottom: 26px; flex-wrap: wrap; justify-content: center; }
  .splash-chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.16); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; }
  .splash-chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .splash .btn { max-width: 250px; margin-bottom: 10px; }
  .splash .btn-outline { background: transparent; color: #fff; border: 1.5px solid rgba(255, 255, 255, 0.55); }
  .rainbow-anim { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: var(--rainbow); background-size: 200% 100%; animation: slideRb 6s linear infinite; z-index: 2; }
  @keyframes slideRb { to { background-position: 200% 0; } }

  /* ---------- hero (student home) ---------- */
  .hero {
    position: relative; overflow: hidden; border-radius: 24px; padding: 18px; color: #fff; margin-bottom: 14px;
    background: linear-gradient(135deg, #2563eb 0%, #7c3aed 58%, #db2777 100%); box-shadow: var(--shadow);
  }
  .hero::before { content: ""; position: absolute; right: -36px; top: -36px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 196, 31, 0.6), transparent 70%); }
  .hero::after { content: ""; position: absolute; left: -40px; bottom: -50px; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(34, 197, 139, 0.55), transparent 70%); }
  .hero > * { position: relative; z-index: 1; }
  .hero small { opacity: 0.9; font-size: 12px; font-weight: 600; }
  .hero h1 { font-family: var(--font-head); font-size: 25px; margin: 2px 0 2px; }
  .hero-sub { margin: 0 0 14px; font-size: 12.5px; opacity: 0.92; }
  .hero-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chip { display: flex; align-items: center; gap: 9px; background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 15px; padding: 10px; }
  .chip-ic { width: 32px; height: 32px; border-radius: 10px; background: rgba(255, 255, 255, 0.95); color: #4338ca; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .chip-ic svg { width: 17px; height: 17px; }
  .chip small { display: block; font-size: 10.5px; opacity: 0.9; }
  .chip b { font-size: 13px; }

  .tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile {
    border: none; border-radius: 20px; padding: 14px; text-align: left; cursor: pointer; color: #1b2340;
    display: flex; flex-direction: column; gap: 10px; min-height: 104px; box-shadow: var(--shadow); transition: transform .12s ease;
  }
  .tile:active { transform: scale(0.97); }
  .tile .icon-circle { width: 40px; height: 40px; }
  .tile b { font-family: var(--font-head); font-size: 14.5px; display: block; }
  .tile span.sub { font-size: 11.5px; font-weight: 600; opacity: 0.75; }

  /* ---------- lists ---------- */
  .bus-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 6px; border: none; border-bottom: 1px solid var(--line);
    cursor: pointer; background: none; width: 100%; text-align: left; color: var(--ink); min-height: 64px;
  }
  .bus-row:last-child { border-bottom: none; }
  .bus-row:hover { background: var(--tint); border-radius: 12px; }
  .bus-badge {
    width: 48px; height: 48px; border-radius: 14px; font-family: var(--font-head); font-weight: 700; font-size: 12.5px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; text-align: center; line-height: 1.05;
  }
  .row-title { font-weight: 700; font-size: 13.5px; }

    check: '<svg viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    dash: '<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="8" rx="2" stroke="currentColor" stroke-width="1.9"/><rect x="13" y="4" width="7" height="5" rx="2" stroke="currentColor" stroke-width="1.9"/><rect x="13" y="11" width="7" height="9" rx="2" stroke="currentColor" stroke-width="1.9"/><rect x="4" y="14" width="7" height="6" rx="2" stroke="currentColor" stroke-width="1.9"/></svg>',

  };
  function white(svg){ return svg.replace(/currentColor/g, "#fff"); }

  /* original mini metro symbol: an "M" riding a track line */
  var mmCount = 0;
  function metroMark(size){
    mmCount++;
    var id = "mmg" + mmCount;
    size = size || 22;
    return '<svg class="metro-mark" width="' + size + '" height="' + size + '" viewBox="0 0 32 32" role="img" aria-label="Metro">' +
      '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c58b"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>' +
      '<rect width="32" height="32" rx="9" fill="url(#' + id + ')"/>' +
      '<path d="M8 21.5V11l8 7 8-7v10.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M7 26h18" stroke="#fff" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/></svg>';
  }

  /* ================= state ================= */
  var state = {
    screen: "splash", user: null,
    busTab: "mine", railTab: "metro",
    selectedBus: null, selectedStudent: null,
    selectedMetroLine: "red", selectedMmtsRoute: "fl",
    backTo: null
  };
  var PUBLIC = ["splash", "login", "signup"];
  var HOD_ONLY = ["hodDashboard", "studentList", "studentDetail", "hodBuses", "localityList"];
  var STUDENT_ONLY = ["studentHome", "busList", "savedRoutes"];

  var el = document.getElementById("screen");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2200);
  }

  function isHod(){ return !!(state.user && state.user.role === "hod"); }

  function go(screen, extra){
    if (!state.user && PUBLIC.indexOf(screen) === -1) screen = "login";
    if (state.user && HOD_ONLY.indexOf(screen) !== -1 && !isHod()){
      toast("That area is for the HOD only.");
      screen = "studentHome";
    }
    if (isHod() && STUDENT_ONLY.indexOf(screen) !== -1) screen = "hodDashboard";
    state.screen = screen;
    if (extra) Object.keys(extra).forEach(function(k){ state[k] = extra[k]; });
    render();
    var sc = el.querySelector(".screen-scroll");
    if (sc) sc.scrollTop = 0;
  }

  /* ================= data helpers ================= */
  function findBus(no){ return buses.filter(function(b){ return b.no === no; })[0] || buses[0]; }
  function busesFor(loc){
    if (!loc) return [];
    return buses.filter(function(b){
      return b.to === DEST && b.stops.some(function(s){ return s.indexOf(loc) === 0; });
    });
  }
  function statusPill(status, small){
    var cls = status === "Verified" ? "ver" : "unv";
    var icon = status === "Verified" ? "✓" : "!";
    return '<span class="status ' + cls + (small ? " sm" : "") + '">' + icon + ' ' + esc(status) + '</span>';
  }

  /* ================= shared chrome ================= */
  function topbar(title, back, extra){
    return '<div class="topbar">' +
      (back ? '<button class="back" data-go="' + back + '" aria-label="Go back">' + ICON.back + '</button>' : '') +
      '<h2>' + esc(title) + '</h2>' +
      (extra ? '<span class="topbar-extra">' + extra + '</span>' : '') +
      '</div>';
  }

  function navItem(id, icon, label, active){
    return '<button class="navitem' + (active ? ' active' : '') + '" data-go="' + id + '"' + (active ? ' aria-current="page"' : '') + '>' + icon + '<span>' + label + '</span></button>';
  }
  function navFor(screen){
    if (!state.user || PUBLIC.indexOf(screen) !== -1) return "";
    var hod = isHod();
    var tab;
    if (hod){
      tab = { hodDashboard:"d", localityList:"d", hodBuses:"b", busDetails:"b", timings:"b", studentList:"s", studentDetail:"s", profile:"p", editProfile:"p", railHome:"r", metroLine:"r", mmtsRoute:"r" }[screen];
      return '<nav class="bottomnav" aria-label="Main">' +
        navItem("hodDashboard", ICON.dash, "Dashboard", tab === "d") +
        navItem("studentList", ICON.people, "Students", tab === "s") +
        navItem("hodBuses", ICON.bus, "Buses", tab === "b") +
        navItem("profile", ICON.profile, "Profile", tab === "p") +
        '</nav>';
    }
    tab = { studentHome:"h", busList:"b", busDetails:"b", timings:"b", railHome:"r", metroLine:"r", mmtsRoute:"r", profile:"p", editProfile:"p", savedRoutes:"p" }[screen];
    return '<nav class="bottomnav" aria-label="Main">' +
      navItem("studentHome", ICON.home, "Home", tab === "h") +
      navItem("busList", ICON.bus, "Buses", tab === "b") +
      navItem("railHome", ICON.train, "Rail", tab === "r") +
      navItem("profile", ICON.profile, "Profile", tab === "p") +
      '</nav>';
  }

  /* ================= reusable blocks ================= */
  function busRow(b, back){
    var h = hue(buses.indexOf(b));
    return '<button class="bus-row" data-go="busDetails" data-bus="' + esc(b.no) + '" data-back="' + esc(back || "") + '">' +
      '<div class="bus-badge" style="background:' + h.bg + ';color:' + h.fg + '">' + esc(b.no) + '</div>' +
      '<div class="grow"><div class="row-title">' + esc(b.from) + ' → ' + esc(b.to) + '</div>' +
      '<div class="row-sub">' + esc(b.duration) + ' ' + statusPill(b.status, true) + '</div></div>' +
      '<span class="chev">' + ICON.chevR + '</span></button>';
  }
  function emptyState(icon, bg, title, text, btn){
    return '<div class="empty"><div class="icon-circle" style="background:' + bg + '">' + icon + '</div>' +
      '<h3 class="h2">' + esc(title) + '</h3><p class="muted">' + esc(text) + '</p>' + (btn || "") + '</div>';
  }
  function stopList(list, color){
    return list.map(function(s, i){
      var end = (i === 0 || i === list.length - 1);
      var c = end ? "#e11d48" : color;
      return '<div class="stop-item">' +
        '<div class="stop-wrap" style="color:' + c + '"><div class="stop-dot"></div>' +
        (i < list.length - 1 ? '<div class="stop-line" style="background:' + color + ';opacity:.45"></div>' : '') + '</div>' +
        '<span class="stop-name" style="' + (end ? "font-weight:700" : "") + '">' + esc(s) + '</span>' +
        '<span class="stop-no">' + (i + 1) + '</span></div>';
    }).join("");
  }
  function menuItem(go, bg, icon, title, sub){
    return '<button class="menu-item" data-go="' + go + '"><span class="icon-circle" style="background:' + bg + '">' + icon + '</span>' +
      '<span><b>' + esc(title) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span><span class="chev">' + ICON.chevR + '</span></button>';
  }

        '<div class="bus-badge" style="background:' + l.color + ';color:#fff;font-size:10.5px;">' + l.name.split(" ")[0].toUpperCase() + '</div>' +
        '<div class="grow"><div class="row-title">' + esc(l.from) + ' → ' + esc(l.to) + '</div>' +
        '<div class="row-sub">' + l.stations.length + ' stations · ' + esc(l.length) + '</div></div>' +
        '<span class="chev">' + ICON.chevR + '</span></button>';
    }).join("") + '</div>';
  }

  function mmtsList(){
    return '<div class="card flush">' + mmtsRoutes.map(function(r, i){
      var h = hue(i * 2 + 4);
      return '<button class="bus-row" data-go="mmtsRoute" data-mmtsroute="' + r.id + '">' +
        '<div class="bus-badge" style="background:' + h.bg + ';color:' + h.fg + ';font-size:10px;">MMTS</div>' +
        '<div class="grow"><div class="row-title">' + esc(r.name) + '</div>' +
        '<div class="row-sub">' + esc(r.tag) + ' · ' + esc(r.duration) + '</div></div>' +
        '<span class="chev">' + ICON.chevR + '</span></button>';
    }).join("") + '</div>';
  }

  screens.metroLine = function(){
    var l = metroLines.filter(function(x){ return x.id === state.selectedMetroLine; })[0] || metroLines[0];
    var rows = l.stations.map(function(s, i){
      var end = (i === 0 || i === l.stations.length - 1);
      var ix = l.ix.indexOf(s) !== -1;
      var c = end ? "#e11d48" : l.color;
      return '<div class="stop-item">' +
        '<div class="stop-wrap" style="color:' + c + '"><div class="stop-dot"></div>' +
        (i < l.stations.length - 1 ? '<div class="stop-line" style="background:' + l.color + '"></div>' : '') + '</div>' +
        '<span class="stop-name" style="font-size:12.5px;' + (end ? "font-weight:700" : "") + '">' + esc(s) + '</span>' +
        (ix ? '<span class="ix-pill">Interchange</span>' : '') + '</div>';
    }).join("");
    return topbar(l.name, "railHome", metroMark(30)) +
      '<div class="screen-scroll" style="padding-top:6px;">' +
      '<div class="card center">' +
        '<div class="icon-circle" style="margin:0 auto 8px;width:50px;height:50px;background:' + l.color + ';">' + white(ICON.train) + '</div>' +
        '<div class="h1" style="font-size:18px;">' + esc(l.from) + ' ↔ ' + esc(l.to) + '</div>' +
        '<p class="muted">' + l.stations.length + ' stations · ' + esc(l.length) + '</p>' +
        '<div class="line-strip" style="background:' + l.color + '"></div></div>' +
      '<div class="card">' +
        '<div class="info-row"><span class="k">First train</span><span class="v">' + esc(l.first) + '</span></div>' +
        '<div class="info-row"><span class="k">Last train</span><span class="v">' + esc(l.last) + '</span></div>' +
        '<div class="info-row"><span class="k">Frequency</span><span class="v">' + esc(l.frequency) + '</span></div>' +
        '<div class="info-row"><span class="k">Interchange</span><span class="v">' + esc(l.interchange) + '</span></div>' +
      '</div>' +
      '<div class="card"><div class="h2" style="margin-bottom:6px;">All stations (' + l.stations.length + ')</div>' + rows + '</div>' +
      '</div>';
  };

  screens.mmtsRoute = function(){
    var r = mmtsRoutes.filter(function(x){ return x.id === state.selectedMmtsRoute; })[0] || mmtsRoutes[0];
    return topbar("MMTS route", "railHome") +
      '<div class="screen-scroll" style="padding-top:6px;">' +
      '<div class="card center">' +
        '<div class="icon-circle" style="margin:0 auto 8px;width:50px;height:50px;background:#9333ea;">' + white(ICON.train) + '</div>' +
        '<div class="h1" style="font-size:17px;">' + esc(r.name) + '</div>' +
        '<p class="muted">' + esc(r.tag) + ' · ' + esc(r.duration) + '</p></div>' +
      '<div class="card">' +
        '<div class="info-row"><span class="k">First service</span><span class="v">' + esc(r.first) + '</span></div>' +
        '<div class="info-row"><span class="k">Last service</span><span class="v">' + esc(r.last) + '</span></div>' +
        '<div class="info-row"><span class="k">Frequency</span><span class="v">' + esc(r.frequency) + '</span></div></div>' +
      (r.stations
        ? '<div class="card"><div class="h2" style="margin-bottom:6px;">All stations (' + r.stations.length + ')</div>' + stopList(r.stations, "#9333ea") + '</div>'
        : '<div class="card"><p class="muted" style="line-height:1.5;">' + esc(r.note || "") + '</p></div>') +
      '</div>';
  };

  /* ---------- profile ---------- */
  screens.profile = function(){
    var u = state.user, hod = isHod();
    var back = hod ? "hodDashboard" : "studentHome";
    return topbar("My profile", back) +
      '<div class="screen-scroll" style="padding-top:6px;">' +
      '<div class="center" style="margin-bottom:14px;">' +
        '<div class="avatar">' + esc(initials(u.name)) + '</div>' +
        '<div class="h1" style="font-size:20px;">' + esc(u.name) + '</div>' +
        '<span class="pill">' + (hod ? "HOD" : "Student") + '</span></div>' +
      '<div class="card">' +
        (hod
          ? '<div class="info-row"><span class="k">Email</span><span class="v">' + esc(u.email) + '</span></div><div class="info-row"><span class="k">Access</span><span class="v">Administrator</span></div>'
          : '<div class="info-row"><span class="k">Roll number</span><span class="v">' + esc(u.roll) + '</span></div>' +
            '<div class="info-row"><span class="k">Year</span><span class="v">' + esc(u.year) + '</span></div>' +
            '<div class="info-row"><span class="k">Home locality</span><span class="v">' + esc(u.locality) + '</span></div>' +
            '<div class="info-row"><span class="k">Email</span><span class="v">' + esc(u.email) + '</span></div>') +
      '</div>' +
      (hod ? '' : menuItem("editProfile", "#2563eb", white(ICON.edit), "Edit profile", "Change your name or home locality") +
                  menuItem("savedRoutes", "#e11d48", white(ICON.bookmark), "Saved routes", savedFor(u).length + " saved")) +
      '<button class="menu-item" data-act="logout"><span class="icon-circle" style="background:#64748b">' + white(ICON.logout) + '</span><span><b>Log out</b></span></button>' +
      '</div>';
  };

  screens.editProfile = function(){
    var u = state.user;
    var opts = LOCALITIES.filter(function(l){ return l.name !== DEST; }).map(function(l){
      return '<option' + (l.name === u.locality ? " selected" : "") + '>' + esc(l.name) + '</option>';
    }).join("");
    return topbar("Edit profile", "profile") +
      '<div class="screen-scroll" style="padding-top:6px;">' +
      '<div id="editError" class="form-error" role="alert" hidden></div>' +
      '<div class="field"><label for="epName">Full name</label><input id="epName" type="text" value="' + esc(u.name) + '"></div>' +
      (isHod() ? '' : '<div class="field"><label for="epLocality">Home locality</label><select id="epLocality">' + opts + '</select></div>') +
      '<button class="btn btn-primary" data-act="saveProfile">Save changes</button></div>';
  };

  /* ---------- HOD ---------- */
  screens.hodDashboard = function(){
    var studs = users.filter(function(u){ return u.role === "student"; });
    return '<div class="screen-scroll">' +
      '<div class="hero" style="background:linear-gradient(135deg,#1e1b4b,#4338ca 55%,#db2777);">' +
        '<small>HOD Dashboard</small><h1>Manage. Monitor. Support.</h1>' +
        '<p class="hero-sub" style="margin:0;">Students, bus services and locality coverage at a glance.</p></div>' +
      '<div class="stat-grid">' +
        '<div class="stat-tile" style="background:linear-gradient(135deg,#7c3aed,#db2777)"><div class="num">' + studs.length + '</div><div class="lbl">Total students</div></div>' +
        '<div class="stat-tile" style="background:linear-gradient(135deg,#ea580c,#e11d48)"><div class="num">' + buses.length + '</div><div class="lbl">Total buses</div></div>' +
      '</div>' +
      menuItem("studentList", "#7c3aed", white(ICON.people), "Student list", "View every student and their locality") +
      menuItem("hodBuses", "#ea580c", white(ICON.bus), "Manage buses", "Review services and data status") +
      menuItem("localityList", "#059669", white(ICON.map), "Manage localities", LOCALITIES.length + " localities in the dataset") +
      menuItem("hodBuses", "#2563eb", white(ICON.stops), "Manage stops", "Open a bus to see ordered stops") +
      menuItem("hodBuses", "#f59e0b", white(ICON.clock), "Manage timings", "Open a bus to see departures") +
      '</div>';
  };

  function studentRows(q){
    q = (q || "").trim().toLowerCase();
    var list = users.filter(function(u){
      return u.role === "student" && (!q || (u.name + " " + u.roll + " " + u.locality).toLowerCase().indexOf(q) !== -1);
    });
    if (!list.length) return emptyState(white(ICON.people), "#7c3aed", "No students found", "Try a different name, roll number or locality.", "");
    return '<div class="card flush">' + list.map(function(u, i){
      var h = hue(i * 2 + 5);
      return '<button class="bus-row" data-go="studentDetail" data-student="' + esc(u.id) + '">' +
        '<div class="avatar sm" style="background:' + h.bg + ';color:' + h.fg + '">' + esc(initials(u.name)) + '</div>' +
        '<div class="grow"><div class="row-title">' + esc(u.name) + '</div>' +
        '<div class="row-sub">' + esc(u.roll) + ' · ' + esc(u.year) + ' · ' + esc(u.locality) + '</div></div>' +
        '<span class="chev">' + ICON.chevR + '</span></button>';
    }).join("") + '</div>';
  }

  screens.studentList = function(){
    return topbar("Students", "hodDashboard") +
      '<div class="screen-scroll" style="padding-top:6px;">' +
      '<div class="search-wrap">' + ICON.search + '<input id="studentSearch" type="search" placeholder="Search name, roll number or locality" aria-label="Search students"></div>' +
      '<div id="studentRows">' + studentRows("") + '</div></div>';
  };

  screens.studentDetail = function(){
    var s = users.filter(function(u){ return u.id === state.selectedStudent; })[0] || users[0];
    var list = busesFor(s.locality);
    return topbar("Student details", "studentList") +
      '<div class="screen-scroll" style="padding-top:6px;">' +
      '<div class="center" style="margin-bottom:12px;"><div class="avatar">' + esc(initials(s.name)) + '</div>' +
        '<div class="h1" style="font-size:20px;">' + esc(s.name) + '</div><span class="pill">' + esc(s.roll) + '</span></div>' +
      '<div class="card">' +
        '<div class="info-row"><span class="k">Year</span><span class="v">' + esc(s.year) + '</span></div>' +
        '<div class="info-row"><span class="k">Home locality</span><span class="v">' + esc(s.locality) + '</span></div>' +
        '<div class="info-row"><span class="k">Email</span><span class="v">' + esc(s.email) + '</span></div></div>' +
      '<div class="section-title">Available buses from ' + esc(s.locality) + '</div>' +
      (list.length ? '<div class="card flush">' + list.map(function(b){ return busRow(b, "studentDetail"); }).join("") + '</div>'
                   : '<div class="card">' + emptyState(white(ICON.bus), "#ea580c", "No buses found", "No route in the dataset connects " + s.locality + " to " + DEST + ".", "") + '</div>') +
      '</div>';
  };

  screens.localityList = function(){
    return topbar("Localities", "hodDashboard") +
      '<div class="screen-scroll" style="padding-top:6px;">' +
      '<div class="card flush">' + LOCALITIES.map(function(l, i){
        var h = hue(i * 2 + 3);
        var sc = users.filter(function(u){ return u.role === "student" && u.locality === l.name; }).length;
        var bc = l.name === DEST ? "Destination" : busesFor(l.name).length + " bus" + (busesFor(l.name).length === 1 ? "" : "es");
        return '<div class="bus-row" style="cursor:default">' +
          '<div class="icon-circle" style="background:' + h.bg + ';color:' + h.fg + '">' + ICON.pin + '</div>' +
          '<div class="grow"><div class="row-title">' + esc(l.name) + '</div><div class="row-sub">' + esc(l.city) + ' · ' + sc + ' student' + (sc === 1 ? "" : "s") + ' · ' + bc + '</div></div></div>';
      }).join("") + '</div></div>';
  };

  /* ================= render + events ================= */
  function render(){
    var fn = screens[state.screen] || screens.splash;
    el.innerHTML = '<div class="rainbow-bar"></div>' + fn() + navFor(state.screen);
  }

  function showError(id, msg){
    var box = document.getElementById(id);
    if (box){ box.textContent = msg; box.hidden = false; }
  }

  var actions = {
    login: function(){
      var id = (document.getElementById("loginId").value || "").trim().toLowerCase();
      var pw = document.getElementById("loginPw").value || "";
      if (!id || !pw){ showError("loginError", "Enter your email or roll number and password."); return; }
      var u = users.filter(function(x){ return x.email.toLowerCase() === id || (x.role === "student" && x.roll.toLowerCase() === id); })[0];
      if (!u || u.pw !== pw){ showError("loginError", "Those details don't match an account. Check them and try again."); return; }
      state.user = u;
      state.busTab = "mine";
      go(u.role === "hod" ? "hodDashboard" : "studentHome");
    },
    signup: function(){
      var name = (document.getElementById("suName").value || "").trim();
      var roll = (document.getElementById("suRoll").value || "").trim().toUpperCase();
      var year = document.getElementById("suYear").value;
      var loc = document.getElementById("suLocality").value;
      var pw = document.getElementById("suPw").value || "";
      if (!name || !roll){ showError("signupError", "Please add your name and roll number."); return; }
      if (pw.length < 6){ showError("signupError", "Choose a password with at least 6 characters."); return; }
      if (users.some(function(x){ return x.roll.toUpperCase() === roll; })){ showError("signupError", "That roll number is already registered. Try logging in."); return; }
      var u = { id:"s" + Date.now(), name:name, roll:roll, year:year, locality:loc, email:roll.toLowerCase() + "@jnafau.ac.in", role:"student", pw:pw };
      users.push(u);
      state.user = u;
      state.busTab = "mine";
      go("studentHome");
      toast("Welcome aboard, " + firstName(name) + "!");
    },
    logout: function(){ state.user = null; go("login"); },
    bustab: function(t){ state.busTab = t.getAttribute("data-tab"); render(); },
    railtab: function(t){ state.railTab = t.getAttribute("data-tab"); render(); },
    toggleSave: function(t){
      var no = t.getAttribute("data-bus"), u = state.user;
      var list = savedFor(u).slice();
      var idx = list.map(function(s){ return s.no; }).indexOf(no);
      if (idx === -1){ list.push({ no:no, date:new Date().toISOString() }); toast("Route " + no + " saved"); }
      else { list.splice(idx, 1); toast("Route " + no + " removed"); }
      saved[u.id] = list;
      persistSaved();
      render();
    },
    saveProfile: function(){
      var name = (document.getElementById("epName").value || "").trim();
      if (!name){ showError("editError", "Your name can't be empty."); return; }
      state.user.name = name;
      var loc = document.getElementById("epLocality");
      if (loc) state.user.locality = loc.value;
      toast("Profile updated");
      go("profile");
    }
  };

  el.addEventListener("click", function(e){
    var t = e.target.closest("[data-go],[data-act]");
    if (!t || !el.contains(t)) return;
    var act = t.getAttribute("data-act");
    if (act){ if (actions[act]) actions[act](t); return; }
    var extra = {};
    if (t.hasAttribute("data-bus")) extra.selectedBus = t.getAttribute("data-bus");
    if (t.hasAttribute("data-student")) extra.selectedStudent = t.getAttribute("data-student");
    if (t.hasAttribute("data-metroline")) extra.selectedMetroLine = t.getAttribute("data-metroline");
    if (t.hasAttribute("data-mmtsroute")) extra.selectedMmtsRoute = t.getAttribute("data-mmtsroute");
    if (t.hasAttribute("data-railtab")) extra.railTab = t.getAttribute("data-railtab");
    if (t.hasAttribute("data-bustab")) extra.busTab = t.getAttribute("data-bustab");
    var target = t.getAttribute("data-go");
    if (target === "busDetails") extra.backTo = t.getAttribute("data-back") || null;
    go(target, extra);
  });

  el.addEventListener("input", function(e){
    if (e.target && e.target.id === "studentSearch"){
      var rows = document.getElementById("studentRows");
      if (rows) rows.innerHTML = studentRows(e.target.value);
    }
  });

  el.addEventListener("keydown", function(e){
    if (e.key === "Enter" && e.target && (e.target.id === "loginId" || e.target.id === "loginPw")) actions.login();
  });

  /* ================= install banner ================= */
  (function(){
    var banner = document.getElementById("installBanner");
    var btn = document.getElementById("installBannerBtn");
    var closeBtn = document.getElementById("installBannerClose");
    var titleEl = document.getElementById("installBannerTitle");
    var subEl = document.getElementById("installBannerSub");
    var deferred = null;
    var standalone = false;
    try { standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true; } catch(e){}
    if (standalone) return;
    var dismissed = false;
    try { dismissed = window.sessionStorage.getItem("ats-install-dismissed") === "1"; } catch(e){}
    if (dismissed) return;

    var ua = navigator.userAgent || "";
    var isIOS = /iphone|ipad|ipod/i.test(ua);
    var isAndroid = /android/i.test(ua);

    window.addEventListener("beforeinstallprompt", function(e){
      e.preventDefault();
      deferred = e;
      subEl.textContent = "Get the full-screen app experience, no browser bar.";
      btn.textContent = "Install";
      banner.hidden = false;
    });
    window.addEventListener("appinstalled", function(){ banner.hidden = true; });

    if (isIOS){
      subEl.textContent = "Tap the Share icon, then “Add to Home Screen.”";
      btn.textContent = "Got it";
      banner.hidden = false;
    } else if (isAndroid){
      subEl.textContent = "Open the browser menu and tap “Add to Home screen.”";
      btn.textContent = "Got it";
      setTimeout(function(){ if (!deferred) banner.hidden = false; }, 800);
    }
    btn.addEventListener("click", function(){
      if (deferred){
        deferred.prompt();
        deferred.userChoice.then(function(){ deferred = null; banner.hidden = true; });
      } else {
        banner.hidden = true;
      }
    });
    closeBtn.addEventListener("click", function(){
      banner.hidden = true;
      try { window.sessionStorage.setItem("ats-install-dismissed", "1"); } catch(e){}
    });
  })();

  document.getElementById("restartBtn").addEventListener("click", function(){
    state.user = null;
    go("splash");
  });

  render();
})();
</script>

<script>
  // Progressive Web App support. The app still works if service workers are unavailable.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./service-worker.js").catch(function (error) {
        console.warn("Service worker registration failed:", error);
      });
    });
  }
</script>

</body>
</html>
